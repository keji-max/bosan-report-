<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보산동 소규모주택정비 관리계획 - 중간보고</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Gowun Batang', serif;
            background: #f5f0e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background: #f5f0e8;
            color: #111;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            border-bottom: 2px solid #222;
        }
        header h1 {
            font-family: 'Gowun Batang', serif;
            font-size: 20px;
            font-weight: 700;
        }
        header p {
            font-family: 'Gowun Batang', serif;
            font-size: 14px;
            color: #555;
            margin-top: 6px;
            font-weight: 700;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .pdf-viewer {
            flex: 1;
            width: 100%;
            min-height: 80vh;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .download-btn {
            display: inline-block;
            margin: 12px auto;
            padding: 10px 24px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: 'Gowun Batang', serif;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #444; }
    </style>
</head>
<body>
    <header>
        <h1>보산동 소규모주택정비 관리계획 수립 및 관리지역 지정 용역</h1>
        <p>중간보고 자료</p>
    </header>
    <div class="container">
        <iframe class="pdf-viewer" src="report.pdf"></iframe>
        <div style="text-align:center;">
            <a class="download-btn" href="report.pdf" download>PDF 다운로드</a>
        </div>
    </div>
</body>
</html>

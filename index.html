<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보산동 소규모주택정비 관리계획 - 중간보고</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background: #1a365d;
            color: white;
            width: 100%;
            padding: 16px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .pdf-viewer {
            flex: 1;
            width: 100%;
            min-height: 80vh;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .download-btn {
            display: inline-block;
            margin: 12px auto;
            padding: 10px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>보산동 소규모주택정비 관리계획 수립 및 관리지역 지정 용역</h1>
        <p>중간보고 자료</p>
    </header>
    <div class="container">
        <iframe class="pdf-viewer" src="report.pdf"></iframe>
        <div style="text-align:center;">
            <a class="download-btn" href="report.pdf" download>PDF 다운로드</a>
        </div>
    </div>
</body>
</html>
